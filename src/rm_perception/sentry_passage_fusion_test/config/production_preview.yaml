# Test host loads the production correction plugin, but has no controller.
/passage_fusion_test/fusion_harness:
  ros__parameters:
    use_sim_time: false
    production_preview: true
    static_layer:
      enabled: true
      map_topic: /map
      map_subscribe_transient_local: true
      footprint_clearing_enabled: false
    correction_layer:
      enabled: true
      allow_verified_evidence: true
      evidence_timeout: 1.0
      evidence_topic: /passage_fusion_test/preview_static_clearing
    terrain_layer:
      enabled: true
      topic: /terrain/grid
      data_timeout: 0.7
    inflation_layer:
      enabled: true
      inflation_radius: 0.3
      cost_scaling_factor: 5.0
      inflate_unknown: false
      inflate_around_unknown: false
